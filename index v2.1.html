		/* Splash screen */
			#splash {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: white;
			opacity: 1;
			z-index: 9999;

			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;

			font-family: Arial, sans-serif;
			}

			#splash img {

			height: auto;
			margin-bottom: 15px;
			border-radius: 12px;
			}

			#splash h2 {
			font-size: 18px;
			color: #444;
			}

		/* ======= Títulos dentro del selector de capas ======= */
.layer-title {
    font-weight: bold;
    font-size: 10px;
    color: #444;
    text-transform: uppercase;
    display: block;
    margin-top: 6px;
    margin-bottom: 4px;
    pointer-events: none;
}

/* Quitar checkbox solo a los títulos */
.leaflet-control-layers-overlays label:has(.layer-title) input {
    display: none !important;
}

/* Quitar también el espacio que deja el checkbox */
.leaflet-control-layers-overlays label:has(.layer-title) span {
    margin-left: 0px !important;
}

        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }

function pop_elementos_3(feature, layer) {

    var popupContent =
        '<div style="text-align:center; font-size:18px; font-weight:bold;">'
        + (feature.properties['Nombre'] !== null
            ? feature.properties['Nombre'].toLocaleString()
            : '')
        + '</div>';

}


        function style_elementos_3_0() {
            return {
                pane: 'pane_elementos_3',
                radius: 8.0,
                opacity: 1,
                color: 'rgba(0,0,0,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 2.0,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(255,255,255,1.0)',
                interactive: true,
            }
        }
        map.createPane('pane_elementos_3');
        map.getPane('pane_elementos_3').style.zIndex = 402;
        map.getPane('pane_elementos_3').style['mix-blend-mode'] = 'normal';
        var layer_elementos_3 = new L.geoJson(json_elementos_3, {
            attribution: '',
            interactive: true,
            dataVar: 'json_elementos_3',
            layerName: 'layer_elementos_3',
            pane: 'pane_elementos_3',
            onEachFeature: pop_elementos_3,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_elementos_3_0(feature));
            },
        });
        var cluster_elementos_3 = new L.MarkerClusterGroup({showCoverageOnHover: false,
            spiderfyDistanceMultiplier: 2});
        cluster_elementos_3.addLayer(layer_elementos_3);

        bounds_group.addLayer(layer_elementos_3);
        cluster_elementos_3.addTo(map);
